plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "com.facebook.react"     // resolved via includeBuild in settings.gradle
}

react {
  autolinkLibrariesWithApp()
}

// The JS bundle embeds the agent packs (agent/, agent_automotive/) and the car tool JSON (src/**/*.json). The React Native
// plugin only watches .js/.ts files, so a JSON-only edit used to ship the old pack: make the bundle tasks rebuild on them too.
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
  inputs.files(fileTree("../../agent"), fileTree("../../agent_automotive"), fileTree("../../src") { include "**/*.json" })
}

android {
  namespace "com.exampleapp"                 // <-- keep your package
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdkVersion rootProject.ext.compileSdkVersion  // <— use compileSdkVersion (AGP accepts both)

  defaultConfig {
    applicationId "com.exampleapp"           // <-- keep your package
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0"
  }

  // The STT bias list (words_flattened.txt) from the same folder iOS bundles
  // it from, so both platforms use one file.
  sourceSets {
    main {
      assets.srcDirs += ['../../assets/stt_bias_conf']
    }
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      buildConfigField "boolean", "LOGGING_ENABLED", "false"
    }
    release {
      signingConfig signingConfigs.debug
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      buildConfigField "boolean", "LOGGING_ENABLED", "false"
    }
  }

  // AGP 8.x + Gradle 8.x → Java 17 toolchain
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }

  packagingOptions {
    resources { excludes += ["META-INF/**"] }
  }
}

repositories {
  mavenLocal()
}

dependencies {
  implementation("com.facebook.react:react-android")
  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation 'org.webkit:android-jsc:+'
  }
}
