<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#34D399}a:hover{color:#6EE7B7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F0E; color: #F9FAFB; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="position: relative; height: 262px; flex: none; background: repeating-linear-gradient(45deg, #161D1B 0px, #161D1B 3px, #0B0F0E 3px, #0B0F0E 7px)">
    <div style="position: absolute; left: 0; right: 0; top: 190px; height: 44px; background: linear-gradient(180deg, #7C8582 0%, #59625F 30%, #4B5552 55%, #2C3331 100%); border-top: 1px solid #34D399; box-shadow: 0 -10px 22px rgba(16, 185, 129, 0.30)"></div>
    <div style="position: absolute; left: 14px; top: 206px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #C9D0CE, #4B5552); box-shadow: inset 0 0 0 1px #2C3331"></div>
    <div style="position: absolute; right: 14px; top: 206px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #C9D0CE, #4B5552); box-shadow: inset 0 0 0 1px #2C3331"></div>
    <img src="/_blob/14d80748b2c138f9759f82a078f867a0" alt="DaVoice AI emblem" style="position: absolute; left: 87px; top: 28px; width: 216px; height: 216px; z-index: 2; filter: drop-shadow(0 0 22px rgba(52, 211, 153, 0.45))">
  </div>

  <div style="position: relative; z-index: 1; flex: 1; min-height: 0; margin: -12px 12px 0; border: 1.5px solid #4B5552; border-bottom: 0; border-radius: 24px 24px 0 0; background: #0D1210; display: flex; flex-direction: column">
    <svg width="90" height="70" viewBox="0 0 90 70" aria-hidden="true" style="position: absolute; right: 8px; top: 10px"><g fill="none" stroke="#3A4D3F" stroke-width="1.2"><path d="M2 6H58L72 20V66"></path><path d="M24 14H52L62 24V50"></path></g><g fill="#0D1210" stroke="#3A4D3F" stroke-width="1.2"><circle cx="2" cy="6" r="2.5"></circle><circle cx="24" cy="14" r="2.5"></circle><circle cx="72" cy="66" r="2.5"></circle><circle cx="62" cy="50" r="2.5"></circle></g></svg>
    <svg width="70" height="70" viewBox="0 0 70 70" aria-hidden="true" style="position: absolute; left: 8px; top: 10px"><g fill="none" stroke="#3A4D3F" stroke-width="1.2"><path d="M68 6H22L8 20V60"></path></g><g fill="#0D1210" stroke="#3A4D3F" stroke-width="1.2"><circle cx="68" cy="6" r="2.5"></circle><circle cx="8" cy="60" r="2.5"></circle></g></svg>

    <div style="padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #34D399">Step 1 of 5</span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.2">Choose Your Language</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.35; color: #9CA3AF">The language for speech recognition and the voices.</p>
    </div>

    <div style="position: relative; padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
      <span id="lang-label" style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9CA3AF; padding-left: 4px">Language</span>
      <button type="button" aria-haspopup="listbox" aria-expanded="{{ expanded }}" aria-labelledby="lang-label" onClick="{{ toggle }}" style="display: flex; align-items: center; gap: 14px; width: 100%; height: 68px; padding: 0 16px; box-sizing: border-box; border-radius: 14px; border: 1px solid #34D399; background: linear-gradient(180deg, rgba(38, 50, 46, 0.9) 0%, rgba(26, 36, 33, 0.9) 100%); box-shadow: 0 0 12px rgba(16, 185, 129, 0.35); color: #F9FAFB; text-align: left; cursor: pointer; font-family: Inter, sans-serif">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; font-weight: 600">{{ current.native }}</span>
          <span style="font-size: 13px; font-weight: 500; color: #D1D5DB">{{ current.english }}</span>
        </span>
        <span style="font-size: 14px; font-weight: 500; color: #D1D5DB; font-variant-numeric: tabular-nums">{{ current.size }}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ chevron }}deg)"><path d="m6 9 6 6 6-6"></path></svg>
      </button>

      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div role="listbox" aria-labelledby="lang-label" style="position: absolute; left: 16px; right: 16px; top: -100px; z-index: 5; padding: 6px; border-radius: 14px; border: 1px solid #4B5552; background: #121816; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6), 0 0 12px rgba(16, 185, 129, 0.2); display: flex; flex-direction: column">
          <sc-for list="{{ languages }}" as="lang" hint-placeholder-count="11">
            <button type="button" role="option" aria-selected="{{ lang.selected }}" onClick="{{ lang.pick }}" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: {{ lang.bg }}; color: #F9FAFB; text-align: left; cursor: pointer; font-family: Inter, sans-serif">
              <span style="flex: 1; font-size: 14px; font-weight: 600">{{ lang.native }} <span style="font-weight: 400; color: #9CA3AF">· {{ lang.english }}</span></span>
              <span style="font-size: 12px; color: #9CA3AF; font-variant-numeric: tabular-nums">{{ lang.size }}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ lang.check }}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="margin: 18px 16px 0; padding: 4px 16px; border-radius: 14px; border: 1px solid #1F2B27; background: #101614; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 1px solid #1A2421">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        <span style="flex: 1; font-size: 14px">Speech recognition</span>
        <span style="font-size: 13px; color: #9CA3AF">included</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 1px solid #1A2421">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4"></path><path d="M8 7v10"></path><path d="M12 4v16"></path><path d="M16 7v10"></path><path d="M20 10v4"></path></svg>
        <span style="flex: 1; font-size: 14px">Voices and voice cloning</span>
        <span style="font-size: 13px; color: #9CA3AF">included</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.2 7 10 4-1.8 7-5.5 7-10V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span style="flex: 1; font-size: 14px">Runs offline after download</span>
      </div>
    </div>

    <div style="margin-top: auto; padding: 16px 16px 24px">
      <a href="Download.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 14px; background: linear-gradient(180deg, #34D399 0%, #10B981 100%); box-shadow: 0 0 18px rgba(16, 185, 129, 0.45); color: #04140D; font-weight: 700; font-size: 16px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg>
        Download · {{ current.size }}
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showOpen":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'pt-BR', open: null };
  }
  renderVals() {
    const list = [
      ['pt-BR', 'Português do Brasil', 'Brazilian Portuguese', '168 MB'],
      ['en', 'English', 'English', '167 MB'],
      ['pt-PT', 'Português de Portugal', 'European Portuguese', '166 MB'],
      ['de', 'Deutsch', 'German', '166 MB'],
      ['es', 'Español', 'Spanish', '167 MB'],
      ['fr', 'Français', 'French', '167 MB'],
      ['it', 'Italiano', 'Italian', '167 MB'],
      ['nl', 'Nederlands', 'Dutch', '168 MB'],
      ['el', 'Ελληνικά', 'Greek', '136 MB'],
      ['da', 'Dansk', 'Danish', '144 MB'],
      ['sv', 'Svenska', 'Swedish', '145 MB']
    ];
    const open = this.state.open === null ? !!this.props.showOpen : this.state.open;
    const picked = this.state.picked;
    const languages = list.map(([id, native, english, size]) => {
      const on = id === picked;
      return {
        id, native, english: english === native ? '' : english, size,
        selected: on ? 'true' : 'false',
        bg: on ? 'rgba(16, 185, 129, 0.14)' : 'transparent',
        check: on ? '#34D399' : 'transparent',
        pick: () => this.setState({ picked: id, open: false })
      };
    });
    languages.forEach((l) => { if (!l.english) l.english = 'English'; });
    const cur = list.find((l) => l[0] === picked);
    return {
      open,
      expanded: open ? 'true' : 'false',
      chevron: open ? 180 : 0,
      toggle: () => this.setState({ open: !open }),
      current: { native: cur[1], english: cur[2], size: cur[3] },
      languages
    };
  }
}
</script>
</body>
</html>
