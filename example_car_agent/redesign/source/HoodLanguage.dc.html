<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your language under the hood</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#34D399}a:hover{color:#6EE7B7}
.dv-bg{background-image:url(/_blob/057c7e61b5b9c668c7c8089fd1442b3a);background-size:cover;background-position:center top}
@keyframes dvGlow{0%,100%{box-shadow:0 0 14px rgba(52,211,153,0.55),0 0 34px rgba(16,185,129,0.35)}50%{box-shadow:0 0 22px rgba(52,211,153,0.85),0 0 48px rgba(16,185,129,0.5)}}
</style>
</helmet>
<div class="dv-bg" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #0B0F0E; color: #F9FAFB; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <div aria-live="polite" style="position: absolute; left: 50%; top: 384px; transform: translateX(-50%); min-width: 190px; padding: 10px 18px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #34D399; background: rgba(4, 18, 13, 0.82); animation: dvGlow 2.6s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
    <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6EE7B7">Active module</span>
    <span style="font-size: 26px; font-weight: 800; letter-spacing: 0.04em; color: #F9FAFB; text-shadow: 0 0 14px rgba(52, 211, 153, 0.9)">{{ current.code }}</span>
    <span style="font-size: 13px; font-weight: 600; color: #D1FAE5; white-space: nowrap">{{ current.name }} · {{ current.size }}</span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 470px; bottom: 0; border: 1.5px solid #4B5552; border-bottom: 0; border-radius: 20px 20px 0 0; background: rgba(8, 13, 11, 0.95); box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6), 0 -1px 0 rgba(52, 211, 153, 0.5); display: flex; flex-direction: column; overflow: hidden">
    <svg width="120" height="10" viewBox="0 0 120 10" aria-hidden="true" style="position: absolute; left: 14px; top: 10px"><g fill="none" stroke="#3A4D3F" stroke-width="1.2"><path d="M0 5H70L76 1H120"></path></g></svg>
    <svg width="120" height="10" viewBox="0 0 120 10" aria-hidden="true" style="position: absolute; right: 14px; top: 10px"><g fill="none" stroke="#3A4D3F" stroke-width="1.2"><path d="M120 5H50L44 1H0"></path></g></svg>

    <div style="flex: none; padding: 22px 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
      <h1 style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Choose your language</h1>
      <p style="margin: 0; font-size: 13px; color: #6EE7B7">Select a voice pack to install on the engine</p>
    </div>

    <div role="radiogroup" aria-label="Language" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 58px; gap: 10px; -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent 100%); mask-image: linear-gradient(180deg, #000 82%, transparent 100%)">
      <sc-for list="{{ languages }}" as="lang" hint-placeholder-count="11">
        <button type="button" role="radio" aria-checked="{{ lang.checked }}" onClick="{{ lang.pick }}" style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 34px 0 12px; border-radius: 12px; border: 1px solid {{ lang.border }}; background: {{ lang.bg }}; box-shadow: {{ lang.glow }}; color: #F9FAFB; text-align: left; cursor: pointer; font-family: Inter, sans-serif">
          <span style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ lang.code }} <span style="color: #34D399">•</span> {{ lang.native }}</span>
          <span style="font-size: 12px; color: #9CA3AF">{{ lang.size }}</span>
          <sc-if value="{{ lang.on }}" hint-placeholder-val="{{ false }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 10px; top: 50%; margin-top: -9px; filter: drop-shadow(0 0 4px #34D399)"><path d="m5 12 5 5 9-10"></path></svg>
          </sc-if>
          <sc-if value="{{ lang.off }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 10px; top: 50%; margin-top: -9px"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="flex: none; padding: 10px 14px 22px; border-top: 1px solid #1A2421">
      <a href="Download.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 14px; background: linear-gradient(180deg, #34D399 0%, #10B981 100%); box-shadow: 0 0 18px rgba(16, 185, 129, 0.45); color: #04140D; font-weight: 700; font-size: 16px; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg>
        Install {{ current.name }} · {{ current.size }}
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'PT-BR' };
  }
  renderVals() {
    const list = [
      ['PT-BR', 'Português', 'Português do Brasil', '168 MB'],
      ['EN', 'English', 'English', '167 MB'],
      ['PT-PT', 'Português', 'Português de Portugal', '166 MB'],
      ['DE', 'Deutsch', 'Deutsch', '166 MB'],
      ['EL', 'Ελληνικά', 'Ελληνικά', '136 MB'],
      ['ES', 'Español', 'Español', '167 MB'],
      ['FR', 'Français', 'Français', '167 MB'],
      ['IT', 'Italiano', 'Italiano', '167 MB'],
      ['NL', 'Nederlands', 'Nederlands', '168 MB'],
      ['DA', 'Dansk', 'Dansk', '144 MB'],
      ['SV', 'Svenska', 'Svenska', '145 MB']
    ];
    const picked = this.state.picked;
    const languages = list.map(([code, native, name, size]) => {
      const on = code === picked;
      return {
        code, native, size, on, off: !on,
        checked: on ? 'true' : 'false',
        border: on ? '#34D399' : 'rgba(16, 185, 129, 0.45)',
        bg: on ? 'linear-gradient(180deg, rgba(16, 185, 129, 0.28), rgba(16, 185, 129, 0.12))' : 'linear-gradient(180deg, rgba(30, 44, 39, 0.9), rgba(17, 25, 22, 0.9))',
        glow: on ? '0 0 14px rgba(16, 185, 129, 0.5)' : 'none',
        pick: () => this.setState({ picked: code })
      };
    });
    const cur = list.find((l) => l[0] === picked);
    return { languages, current: { code: cur[0], name: cur[2], size: cur[3] } };
  }
}
</script>
</body>
</html>
