<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your language under the hood, option B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#34D399}a:hover{color:#6EE7B7}
.dv-bg2{background-image:linear-gradient(180deg,rgba(11,15,14,0) 0px,rgba(11,15,14,0) 560px,#0B0F0E 680px),url(/_blob/5937c5063080374661434bb3394fb57d);background-size:390px 844px,390px auto;background-repeat:no-repeat;background-position:0 0,0 0}
@keyframes dvSpin{to{transform:rotate(360deg)}}
@keyframes dvGlow2{0%,100%{box-shadow:0 0 16px rgba(52,211,153,0.6),0 0 40px rgba(16,185,129,0.35),inset 0 0 18px rgba(16,185,129,0.35)}50%{box-shadow:0 0 26px rgba(52,211,153,0.9),0 0 56px rgba(16,185,129,0.5),inset 0 0 24px rgba(16,185,129,0.5)}}
</style>
</helmet>
<div class="dv-bg2" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #0B0F0E; color: #F9FAFB; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 40px; right: 40px; top: 196px; height: 56px; border-radius: 28px; background: radial-gradient(ellipse at center, rgba(8, 12, 11, 0.95) 0%, rgba(8, 12, 11, 0.85) 60%, rgba(8, 12, 11, 0) 100%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 202px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center">
    <h1 style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">Choose your language</h1>
    <p style="margin: 0; font-size: 12px; color: #6EE7B7">Select a voice pack to install on the engine</p>
  </div>

  <div aria-live="polite" style="position: absolute; left: 132px; top: 263px; width: 132px; height: 132px; border-radius: 50%">
    <span style="position: absolute; inset: -10px; border-radius: 50%; border: 1.5px dashed rgba(110, 231, 183, 0.55); animation: dvSpin 14s linear infinite"></span>
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #34D399; background: radial-gradient(circle, #0E2A20 0%, #071510 70%); animation: dvGlow2 2.6s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
      <span style="font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6EE7B7">Selected</span>
      <span style="font-size: 24px; font-weight: 800; letter-spacing: 0.03em; text-shadow: 0 0 12px rgba(52, 211, 153, 0.9)">{{ current.code }}</span>
      <span style="font-size: 12px; font-weight: 600; color: #D1FAE5">{{ current.native }}</span>
      <span style="font-size: 11px; color: #9CA3AF">{{ current.size }}</span>
    </div>
  </div>

  <div style="position: absolute; left: 180px; right: 12px; top: 410px; bottom: 98px; border-radius: 16px; border: 1.5px solid rgba(52, 211, 153, 0.7); background: rgba(7, 12, 10, 0.93); box-shadow: 0 0 18px rgba(16, 185, 129, 0.35), 0 12px 30px rgba(0, 0, 0, 0.6); display: flex; overflow: hidden">
    <div role="radiogroup" aria-label="Language" style="flex: 1; min-width: 0; overflow-y: auto; padding: 10px 6px 14px 10px; display: flex; flex-direction: column; gap: 8px; -webkit-mask-image: linear-gradient(180deg, #000 85%, transparent 100%); mask-image: linear-gradient(180deg, #000 85%, transparent 100%)">
      <sc-for list="{{ languages }}" as="lang" hint-placeholder-count="11">
        <button type="button" role="radio" aria-checked="{{ lang.checked }}" onClick="{{ lang.pick }}" style="position: relative; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 54px; padding: 0 30px 0 10px; border-radius: 10px; border: 1px solid {{ lang.border }}; background: {{ lang.bg }}; box-shadow: {{ lang.glow }}; color: #F9FAFB; text-align: left; cursor: pointer; font-family: Inter, sans-serif">
          <span style="font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ lang.code }} <span style="color: #34D399">•</span> {{ lang.native }}</span>
          <span style="font-size: 11px; color: #9CA3AF">{{ lang.size }}</span>
          <sc-if value="{{ lang.on }}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 8px; top: 50%; margin-top: -8px; filter: drop-shadow(0 0 4px #34D399)"><path d="m5 12 5 5 9-10"></path></svg>
          </sc-if>
          <sc-if value="{{ lang.off }}" hint-placeholder-val="{{ true }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 8px; top: 50%; margin-top: -8px"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
    <div aria-hidden="true" style="flex: none; width: 10px; padding: 12px 4px 12px 0; box-sizing: border-box; display: flex; flex-direction: column">
      <div style="position: relative; flex: 1; width: 3px; margin-left: 2px; border-radius: 2px; background: #17211E">
        <div style="position: absolute; left: 0; top: 0; width: 3px; height: 34%; border-radius: 2px; background: #34D399; box-shadow: 0 0 8px #34D399"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; top: 430px; width: 148px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #6EE7B7">11 languages</span>
    <span style="font-size: 12px; line-height: 1.4; color: #D1D5DB; text-shadow: 0 1px 3px #000">Scroll the module rack to pick one. It installs once and runs offline.</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px">
    <a href="Download.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 14px; background: linear-gradient(180deg, #34D399 0%, #10B981 100%); box-shadow: 0 0 18px rgba(16, 185, 129, 0.45); color: #04140D; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M4 17v3h16v-3"></path></svg>
      Install {{ current.name }} · {{ current.size }}
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'PT-BR' };
  }
  renderVals() {
    const list = [
      ['PT-BR', 'Português', 'Português do Brasil', '168 MB'],
      ['EN', 'English', 'English', '167 MB'],
      ['PT-PT', 'Português', 'Português de Portugal', '166 MB'],
      ['DE', 'Deutsch', 'Deutsch', '166 MB'],
      ['EL', 'Ελληνικά', 'Ελληνικά', '136 MB'],
      ['ES', 'Español', 'Español', '167 MB'],
      ['FR', 'Français', 'Français', '167 MB'],
      ['IT', 'Italiano', 'Italiano', '167 MB'],
      ['NL', 'Nederlands', 'Nederlands', '168 MB'],
      ['DA', 'Dansk', 'Dansk', '144 MB'],
      ['SV', 'Svenska', 'Svenska', '145 MB']
    ];
    const picked = this.state.picked;
    const languages = list.map(([code, native, name, size]) => {
      const on = code === picked;
      return {
        code, native, size, on, off: !on,
        checked: on ? 'true' : 'false',
        border: on ? '#34D399' : 'rgba(16, 185, 129, 0.45)',
        bg: on ? 'linear-gradient(180deg, rgba(16, 185, 129, 0.28), rgba(16, 185, 129, 0.12))' : 'linear-gradient(180deg, rgba(30, 44, 39, 0.9), rgba(17, 25, 22, 0.9))',
        glow: on ? '0 0 12px rgba(16, 185, 129, 0.5)' : 'none',
        pick: () => this.setState({ picked: code })
      };
    });
    const cur = list.find((l) => l[0] === picked);
    return { languages, current: { code: cur[0], native: cur[1], name: cur[2], size: cur[3] } };
  }
}
</script>
</body>
</html>
