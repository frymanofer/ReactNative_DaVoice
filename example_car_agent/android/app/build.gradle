plugins {
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
  id "com.facebook.react"     // resolved via includeBuild in settings.gradle
}

react {
  autolinkLibrariesWithApp()
}

// The JS bundle embeds the agent packs (agent/, agent_automotive/) and the car tool JSON (src/**/*.json). The React Native
// plugin only watches .js/.ts files, so a JSON-only edit used to ship the old pack: make the bundle tasks rebuild on them too.
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
  inputs.files(fileTree("../../agent"), fileTree("../../agent_automotive"), fileTree("../../src") { include "**/*.json" })
}

// -PskipHermesc=true: ship the JS bundle as source instead of Hermes bytecode (Hermes still runs it), for machines where
// Windows Smart App Control blocks the unsigned hermesc.exe.
if (project.findProperty("skipHermesc") == "true") {
  react {
    hermesCommand = "${projectDir}/hermesc-skip.cmd"
    hermesFlags = []
  }
}

def appVersionCode = ((project.findProperty("versionCode") ?: System.getenv("VERSION_CODE") ?: "1") as String).toInteger()
def appVersionName = (project.findProperty("versionName") ?: System.getenv("VERSION_NAME") ?: "1.0") as String

android {
  namespace "com.exampleapp"                 // <-- keep your package
  ndkVersion rootProject.ext.ndkVersion
  buildToolsVersion rootProject.ext.buildToolsVersion
  compileSdkVersion rootProject.ext.compileSdkVersion  // <— use compileSdkVersion (AGP accepts both)

  defaultConfig {
    applicationId "io.davoice.voice2voice.caragent"  // the car-agent example installs next to the full example
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // Google Play needs a higher versionCode for every upload: ./gradlew bundleRelease -PversionCode=2 (CI passes its run number).
    versionCode appVersionCode
    versionName appVersionName
  }

  // The STT bias list (words_flattened.txt) from the same folder iOS bundles
  // it from, so both platforms use one file.
  sourceSets {
    main {
      assets.srcDirs += ['../../assets/stt_bias_conf']
    }
  }

  signingConfigs {
    debug {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    // The Google Play upload key. Never in git: the four values come from ~/.gradle/gradle.properties on a Mac, or from the
    // environment in CI (GitHub secrets). Without them a release build is signed with the debug key (fine for the phone,
    // rejected by Google Play).
    upload {
      def v = { String name -> (project.findProperty(name) ?: System.getenv(name)) as String }
      if (v('DAVOICE_UPLOAD_STORE_FILE')) {
        storeFile file(v('DAVOICE_UPLOAD_STORE_FILE'))
        storePassword v('DAVOICE_UPLOAD_STORE_PASSWORD')
        keyAlias v('DAVOICE_UPLOAD_KEY_ALIAS')
        keyPassword v('DAVOICE_UPLOAD_KEY_PASSWORD')
      }
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      buildConfigField "boolean", "LOGGING_ENABLED", "false"
    }
    release {
      signingConfig signingConfigs.upload.storeFile ? signingConfigs.upload : signingConfigs.debug
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      buildConfigField "boolean", "LOGGING_ENABLED", "false"
    }
  }

  // AGP 8.x + Gradle 8.x → Java 17 toolchain
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }

  packagingOptions {
    resources { excludes += ["META-INF/**"] }
  }
}

repositories {
  mavenLocal()
}

dependencies {
  implementation("com.facebook.react:react-android")
  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation 'org.webkit:android-jsc:+'
  }
}
